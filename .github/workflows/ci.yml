name: Continuous Integration

on:
  pull_request:
    branches: [develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: test
          auto-activate-base: false
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          conda activate test
          conda install --yes -c conda-forge python=${{ matrix.python-version }}
          conda install --yes -c conda-forge matplotlib-base aiida-core phonors pytest-regressions pytest pandas dateutils

      - name: Install phonopy main branch
        env:
          PHONOPY_NO_C_EXT: "1"
          CMAKE_GENERATOR: "Unix Makefiles"
        run: |
          conda activate test
          git clone https://github.com/phonopy/phonopy.git
          cd phonopy
          pip install -e . -vvv

      - name: Install phono3py main branch
        env:
          PHONO3PY_NO_C_EXT: "1"
          CMAKE_GENERATOR: "Unix Makefiles"
        run: |
          conda activate test
          git clone https://github.com/phonopy/phono3py.git
          cd phono3py
          pip install -e . -vvv

      - name: Install python dependencies
        run: |
          conda activate test
          pip install -e . -vvv

      - name: Run pytest
        run: |
          conda activate test
          pytest -sv tests
