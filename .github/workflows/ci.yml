name: Continuous Integration

on:
  pull_request:
    branches: [develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          conda activate test
          conda install --yes -c conda-forge python=${{ matrix.python-version }}
          conda install --yes -c conda-forge matplotlib-base aiida-core phonopy phono3py pytest-regressions pytest codecov pytest-cov pandas

      - name: Install python dependencies
        run: |
          conda activate test
          pip install -e . -vvv

      - name: Run pytest
        run: |
          conda activate test
          pytest -sv tests
